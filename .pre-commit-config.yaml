# Pre-commit hooks — mirror .github/workflows/ci.yml (CI parity).
# Install:  bash scripts/install-git-hooks.sh
# Hooks run via `uvx` (no project venv; the tool is stdlib-only at runtime).
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uvx ruff check --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uvx ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: vulture
        name: vulture (dead code)
        entry: uvx vulture
        language: system
        pass_filenames: false
        args: ["email_alert", "tests", "vulture_whitelist.py"]
      - id: pytest
        name: pytest (full suite)
        entry: uvx pytest -q
        language: system
        pass_filenames: false
        stages: [pre-push]
